name: Terragrunt Import

on:
  workflow_call:
    inputs:
      tofu_version:
        description: "Tofu version"
        required: false
        type: string
        default: "1.8.1"
      tg_version:
        description: "Terragrunt version"
        required: false
        type: string
        default: "0.67.0"
      working_directory:
        description: "Working directory for terragrunt"
        required: true
        type: string
      role_to_assume:
        description: "Role to assume for Terragrunt Import Workflow"
        required: true
        type: string
      resource_name:
        description: "Name of the resource to import"
        required: true
        type: string
      resource_id:
        description: "ID of the resource to import"
        required: true
        type: string
      enable_oidc_debugger:
        description: "Enable OIDC Debugger"
        required: false
        type: boolean
        default: false
      workload_identity_provider:
        description: "Workload Identity Provider"
        required: true
        type: string
      service_account:
        description: "Service Account"
        required: true
        type: string

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  oidc_debug_test:
    if: ${{ inputs.enable_oidc_debugger }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    name: OIDC Debugger
    steps:
      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: "${{ github.server_url }}/${{ github.repository_owner }}"

  import:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.github_token }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: Configure AWS Credentials for Terragrunt Import
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: us-east-1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Import Resource
        uses: gruntwork-io/terragrunt-action@v2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tg_version: ${{ inputs.tg_version }}
          tg_dir: ${{ inputs.working_directory }}
          tg_command: >-
            import ${{ inputs.resource_name }} ${{ inputs.resource_id }}
