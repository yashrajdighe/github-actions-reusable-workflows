name: terraform-state-unlock
'on':
  workflow_call:
    inputs:
      terraform-cli-version:
        required: false
        type: string
        default: 1.9.5
      working-dir:
        required: false
        type: string
        default: terraform
      enable-oidc-debugger:
        required: false
        type: boolean
        default: false
      lock-id:
        required: true
        type: string
env:
  WORKING-DIR: '${{ inputs.working-dir }}'
jobs:
  oidc_debug_test:
    if: ${{ inputs.enable-oidc-debugger }}
    runs-on: ubuntu-latest
    name: A test of the oidc debugger
    environment: terraform
    steps:
      - name: Checkout actions-oidc-debugger
        uses: actions/checkout@v5
        with:
          repository: github/actions-oidc-debugger
          ref: main
          path: ./.github/actions/actions-oidc-debugger
      - name: Debug OIDC Claims
        uses: ./.github/actions/actions-oidc-debugger
        with:
          audience: '${{ github.server_url }}/${{ github.repository_owner }}'
  state-unlock:
    runs-on: ubuntu-latest
    environment: terraform
    defaults:
      run:
        shell: bash
        working-directory: '${{ env.WORKING-DIR }}'
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: 'arn:aws:iam::183631350996:role/IaC'
      - name: Get secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: >
            ,arn:aws:secretsmanager:us-east-1:183631350996:secret:github-actions/terraform-cloud-AJdvsd
          name-transformation: none
          parse-json-secrets: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '${{ inputs.terraform-cli-version }}'
      - id: init
        run: terraform init
      - id: force-unlock
        run: terraform force-unlock ${{ inputs.lock-id }}
