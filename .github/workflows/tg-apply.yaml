name: Terrgaunt Apply

on:
  workflow_call:
    inputs:
      tofu_version:
        description: "Tofu version"
        required: false
        type: string
        default: "1.8.1"
      tg_version:
        description: "Terragrunt version"
        required: false
        type: string
        default: "0.67.0"
      runs_on:
        description: "GitHub Actions runner (runs-on) for the apply job only"
        required: false
        type: string
        default: "ubuntu-latest"
      disable_terragrunt_init_parallelism_one:
        description: >-
          If true, run-all init uses default Terragrunt parallelism (omit
          --terragrunt-parallelism 1)
        required: false
        type: boolean
        default: false
      working_directory:
        description: "Working directory for terragrunt"
        required: true
        type: string
      role_to_assume:
        description: "Role to assume for Terragrunt Apply Workflow"
        required: true
        type: string
      enable_oidc_debugger:
        description: "Enable OIDC Debugger"
        required: false
        type: boolean
        default: false
      github_environment:
        description: "GitHub Environment"
        required: true
        type: string
      workload_identity_provider:
        description: "Workload Identity Provider"
        required: true
        type: string
      service_account:
        description: "Service Account"
        required: true
        type: string

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  oidc_debug_test:
    if: ${{ inputs.enable_oidc_debugger }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    name: OIDC Debugger
    steps:
      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@main
        with:
          audience: "${{ github.server_url }}/${{ github.repository_owner }}"

  apply:
    runs-on: ${{ inputs.runs_on }}
    env:
      GITHUB_TOKEN: ${{ secrets.github_token }}
      TERRAGRUNT_NON_INTERACTIVE: true # for backward compatibility
      TG_NON_INTERACTIVE: true
      # Define cache location so you can persist it across runs with actions/cache.
      TG_PROVIDER_CACHE: 1
      TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.terragrunt-provider-cache
    environment: ${{ inputs.github_environment }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # Default wrapper renames the real binary to tofu-bin and sets TOFU_CLI_PATH (see setup-opentofu).
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: true

      - name: Setup Terragrunt
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ inputs.tg_version }}
          tf_path: ${{ env.TOFU_CLI_PATH }}/tofu-bin
          github_token: ${{ github.token }}

      - name: Configure AWS Credentials for Terragrunt Apply
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: us-east-1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Init
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_TFPATH: ${{ env.TOFU_CLI_PATH }}/tofu-bin
        run: |
          if [ "${{ inputs.disable_terragrunt_init_parallelism_one }}" = "true" ]; then
            terragrunt run-all init
          else
            terragrunt run-all init --terragrunt-parallelism 1
          fi

      - name: Apply
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TERRAGRUNT_TFPATH: ${{ env.TOFU_CLI_PATH }}/tofu-bin
        run: terragrunt run-all apply
